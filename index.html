function localInsights(){let x=financeSnapshot(),out=[];if(!x.transactionCount)out.push({level:'info',title:'Start with accurate records',body:'Add income, expenses and account opening balances. Insights become more useful as your ledger grows.'});if(x.income===0&&x.expenses>0)out.push({level:'warn',title:'No income recorded this month',body:'You have expenses but no income entries for this month. Check whether income records are missing.'});if(x.netCashFlow<0)out.push({level:'warn',title:'Negative monthly cash flow',body:`Recorded expenses exceed recorded income by ${money(Math.abs(x.netCashFlow))}. Review category spending and upcoming commitments.`});else if(x.income>0)out.push({level:'good',title:'Positive monthly cash flow',body:`Recorded income exceeds expenses by ${money(x.netCashFlow)} this month. This is based only on entries recorded in EMPIRE.`});x.budgets.filter(b=>b.limit>0&&b.spent>=b.limit).forEach(b=>out.push({level:'warn',title:`${b.category} budget reached`,body:`Recorded spending is ${money(b.spent)} against a ${money(b.limit)} limit.`}));x.budgets.filter(b=>b.limit>0&&b.spent>=b.limit*.8&&b.spent<b.limit).forEach(b=>out.push({level:'info',title:`${b.category} budget is nearly used`,body:`${Math.round(b.spent/b.limit*100)}% of the budget has been used.`}));x.lowStock.forEach(i=>out.push({level:'warn',title:`Low stock: ${i.name}`,body:`Current stock is ${i.stock} ${i.unit}; minimum level is ${i.min} ${i.unit}.`}));x.upcomingBills.filter(b=>b.due&&b.due<=new Date(Date.now()+7*86400000).toISOString().slice(0,10)).forEach(b=>out.push({level:'info',title:`Bill needs attention: ${b.name}`,body:`${money(b.amount)} · due ${b.due}. Confirm the due date and payment status.`}));const day=Number(today().slice(8,10)),daysInMonth=new Date(Number(today().slice(0,4)),Number(today().slice(5,7)),0).getDate();x.budgets.filter(b=>b.limit>0).forEach(b=>{const projected=day?Math.max(0,Number(b.spent)||0)/day*daysInMonth:Math.max(0,Number(b.spent)||0);if(projected>b.limit*1.05)out.push({level:'warn',title:'Month-end runway: '+b.category,body:`At the current pace, ${b.category} may reach ${money(projected)} against its ${money(b.limit)} budget. This is a simple pace estimate, not a forecast guarantee.`})});try{restock().filter(r=>r.alert).forEach(r=>out.push({level:'warn',title:'Price increase: '+r.i.name,body:r.alert+' based on recorded purchase rates. Check unit consistency and receipt before acting.'}))}catch{}if(!out.length)out.push({level:'good',title:'No immediate flags found',body:'Based on the records currently available, no budget or stock warnings were triggered.'});return out}

const cloudCollections={accounts:'account',transactions:'transaction',items:'item',purchases:'purchase',shopping:'shopping_list',shoppingBills:'shopping_bill',budgets:'budget',goals:'goal',bills:'bill',debts:'debt',subscriptions:'subscription',vendors:'vendor',family:'family_profile'};

function cloudUrl(path){if(!cloudCfg.url||!/^https:\/\//i.test(cloudCfg.url))throw Error('Enter a valid HTTPS Supabase project URL');return cloudCfg.url.replace(/\/$/,'')+path}

async function cloudEnsureSession(){if(!cloudSession?.access_token)throw Error('Sign in first');if((cloudSession.expires_at||0)*1000<Date.now()+60000){if(!await cloudRefresh())throw Error('Your session expired. Sign in again.')}}

function cloudRows(){const rows=[];for(const [key,type] of Object.entries(cloudCollections)){for(const item of (db[key]||[])){if(!item||typeof item!=='object')continue;if(!item.id)item.id=uid();rows.push({localId:String(item.id),recordType:type,payload:cloudClean(item),deletedAt:item.deleted?new Date().toISOString():null})}}

function cloudFind(type,localId){if(type==='setting')return db.settings;if(type==='family_profile'&&localId==='profile')return db.profile;const key=Object.keys(cloudCollections).find(k=>cloudCollections[k]===type);return key?(db[key]||[]).find(x=>String(x.id)===String(localId)):null}
function cloudApply(rec){const p={...(rec.payload||{})},localId=String(p._localId||'');delete p._localId;if(rec.record_type==='setting'){db.settings={...db.settings,...p};return}

async function cloudCreateHousehold(name){await cloudEnsureSession();const id=await cloudFetch('/rest/v1/rpc/create_household',{method:'POST',body:JSON.stringify({household_name:name})});cloudCfg.householdId=typeof id==='string'?id:id?.create_household||id;cloudSaveConfig();return cloudCfg.householdId}
async function cloudSync(){if(cloudBusy)return;cloudBusy=true;render();try{await cloudEnsureSession();if(!cloudCfg.householdId)throw Error('Create a household first');db._cloud=db._cloud||{revisions:{},hashes:{},cursor:{updatedAt:'1970-01-01T00:00:00Z',id:'00000000-0000-0000-0000-000000000000'}};const revs=db._cloud.revisions||(db._cloud.revisions={}),hashes=db._cloud.hashes||(db._cloud.hashes={});let pushed=0,conflicts=[];const allRows=cloudRows(),rows=allRows.filter(row=>new TextEncoder().encode(JSON.stringify(row.payload)).length<=230000),skipped=allRows.length-rows.length;
for(let i=0;i<rows.length;i+=100){const batch=rows.slice(i,i+100).map(row=>{const k=row.recordType+':'+row.localId;return{localId:row.localId,recordType:row.recordType,expectedRevision:Number(revs[k]||0),idempotencyKey:row.localId+':'+cloudHash(row.payload),payload:row.payload,deletedAt:row.deletedAt}});const result=await cloudFetch('/rest/v1/rpc/sync_push',{method:'POST',body:JSON.stringify({target_household:cloudCfg.householdId,changes:batch})});for(const r of result.results||[]){const row=rows.find(x=>x.localId===r.localId);const k=(row?.recordType||'')+':'+r.localId;if(['inserted','updated'].includes(r.status)){revs[k]=r.revision;hashes[k]=cloudHash(row.payload);pushed++}else if(r.status!=='unchanged')conflicts.push({localId:r.localId,status:r.status,recordType:row?.recordType||''})}}
let cursor=db._cloud.cursor||{updatedAt:'1970-01-01T00:00:00Z',id:'00000000-0000-0000-0000-000000000000'},pulled=0;for(let page=0;page<20;page++){const qs=new URLSearchParams({target_household:cloudCfg.householdId,after_time:cursor.updatedAt||'1970-01-01T00:00:00Z',after_id:cursor.id||'00000000-0000-0000-0000-000000000000',page_size:'500'});const data=await cloudFetch('/rest/v1/rpc/sync_pull',{method:'POST',body:JSON.stringify({target_household:cloudCfg.householdId,after_time:cursor.updatedAt||'1970-01-01T00:00:00Z',after_id:cursor.id||'00000000-0000-0000-0000-000000000000',page_size:500})});const recs=data.records||[];for(const rec of recs){const localId=String(rec.payload?._localId||''),k=rec.record_type+':'+localId,local=cloudFind(rec.record_type,localId),localHash=local?cloudHash(local):null,knownHash=hashes[k];if(!local){cloudApply(rec);revs[k]=rec.revision;hashes[k]=cloudHash(cloudFind(rec.record_type,localId)||{});pulled++}else if(knownHash&&localHash===knownHash){cloudApply(rec);revs[k]=rec.revision;hashes[k]=cloudHash(cloudFind(rec.record_type,localId)||{});pulled++}else if(Number(rec.revision)>Number(revs[k]||0)){conflicts.push({localId,status:'local_and_cloud_changed',recordType:rec.record_type})}}

async function extractTextFromPDFBufferV26(file) {
const buf = await file.arrayBuffer();
const bytes = new Uint8Array(buf);
let raw = '';
for (let i = 0; i < Math.min(bytes.length, 1500000); i++) {
const c = bytes[i];
if ((c >= 32 && c <= 126) || c === 10 || c === 13) raw += String.fromCharCode(c);
}
// Extract parenthesized PDF text tokens and readable lines
const tokens = [];
const re = /\(([^()\\]{2,120})\)/g;
let m;
while ((m = re.exec(raw)) !== null && tokens.length < 2500) {
const clean = m[1].replace(/[^\x20-\x7E]/g, ' ').trim();
if (clean.length > 1) tokens.push(clean);
}
return tokens.join('\n');
}

const V31 = {
  billDraft: null,
  usageDraft: null,
  auditDraft: {},
  repMode: 'weekly', // 'weekly' | 'monthly' | 'ledger' | 'registers'
  repWeekDate: today(),
  repMonth: month(),
  regTab: 'purchase', // 'purchase' | 'cashbank' | 'vendor' | 'item'
  expandedTx: new Set()
};

function ensureV31Store() {
  db.stockMovements = Array.isArray(db.stockMovements) ? db.stockMovements : [];
  db.consumptionLogs = Array.isArray(db.consumptionLogs) ? db.consumptionLogs : [];
  db.stockVerifications = Array.isArray(db.stockVerifications) ? db.stockVerifications : [];
  db.purchaseBills = Array.isArray(db.purchaseBills) ? db.purchaseBills : [];
  db.monthlyClosings = Array.isArray(db.monthlyClosings) ? db.monthlyClosings : [];

  // Auto-reconcile historical purchases into stockMovements and link to transactions if not yet linked
  const movePurchaseIds = new Set(db.stockMovements.filter(m => m.refType === 'purchase').map(m => m.refId));
  db.purchases.filter(p => !p.deleted && p.id).forEach(p => {
    if (!movePurchaseIds.has(p.id)) {
      const q = num(p.qty), r = num(p.rate) || (q ? num(p.total) / q : 0), tot = num(p.total) || +(q * r).toFixed(2);
      if (q > 0) {
        db.stockMovements.push({
          id: 'sm-p-' + p.id,
          date: p.date || today(),
          itemId: p.itemId || p.name,
          itemName: p.name || 'Item',
          department: p.department || 'Groceries',
          type: 'purchase', // purchase | consumption | wastage | adjustment | return | opening
          qtyIn: q,
          qtyOut: 0,
          unit: p.unit || 'unit',
          rate: r,
          totalCost: tot,
          shop: p.shop || '',
          refType: 'purchase',
          refId: p.id,
          txId: p.txId || '',
          note: 'Purchase' + (p.shop ? ' @ ' + p.shop : '')
        });
      }
    }
    // Also link legacy unlinked purchase to matching transaction on same date & amount
    if (!p.txId) {
      const matchTx = db.transactions.find(t => !t.deleted && t.type === 'expense' && t.date === p.date && (Math.abs(num(t.amount) - num(p.total)) < 0.05 || (t.note && t.note.toLowerCase().includes(String(p.name || '').toLowerCase()))));
      if (matchTx) {
        p.txId = matchTx.id;
        matchTx.items = Array.isArray(matchTx.items) ? matchTx.items : [];
        if (!matchTx.items.some(x => x.purchaseId === p.id)) {
          matchTx.items.push({
            purchaseId: p.id,
            itemId: p.itemId || '',
            name: p.name,
            department: p.department || 'Groceries',
            qty: num(p.qty),
            unit: p.unit || 'unit',
            rate: num(p.rate) || (num(p.qty) ? num(p.total) / num(p.qty) : 0),
            total: num(p.total)
          });
        }
      }
    } else {
      const matchTx = db.transactions.find(t => t.id === p.txId);
      if (matchTx) {
        matchTx.items = Array.isArray(matchTx.items) ? matchTx.items : [];
        if (!matchTx.items.some(x => x.purchaseId === p.id)) {
          matchTx.items.push({
            purchaseId: p.id,
            itemId: p.itemId || '',
            name: p.name,
            department: p.department || 'Groceries',
            qty: num(p.qty),
            unit: p.unit || 'unit',
            rate: num(p.rate) || (num(p.qty) ? num(p.total) / num(p.qty) : 0),
            total: num(p.total)
          });
        }
      }
    }
  });

  // Reconcile v25 waste logs into stockMovements
  const moveWasteIds = new Set(db.stockMovements.filter(m => m.refType === 'waste').map(m => m.refId));
  ((db.v25 && db.v25.waste) || []).forEach(w => {
    if (w && w.id && !moveWasteIds.has(w.id)) {
      const q = num(w.qty), c = num(w.cost);
      db.stockMovements.push({
        id: 'sm-w-' + w.id,
        date: w.date || today(),
        itemId: w.itemId || w.name,
        itemName: w.name,
        department: 'Groceries',
        type: 'wastage',
        qtyIn: 0,
        qtyOut: q,
        unit: w.unit || 'unit',
        rate: q ? +(c / q).toFixed(2) : 0,
        totalCost: c,
        shop: '',
        refType: 'waste',
        refId: w.id,
        note: 'Wastage: ' + (w.reason || 'Expired/Spoiled')
      });
    }
  });
}

// Weighted average unit cost for an item up to a given date
function getItemAvgCostV31(itemOrName, upToDate = '9999-12-31') {
  const it = typeof itemOrName === 'object' ? itemOrName : db.items.find(x => !x.deleted && (String(x.id) === String(itemOrName) || x.name.toLowerCase() === String(itemOrName).toLowerCase()));
  const nameKey = (it ? it.name : String(itemOrName || '')).toLowerCase();
  const idKey = it ? String(it.id) : '';
  const ps = db.purchases.filter(p => !p.deleted && (p.date || '') <= upToDate && ((idKey && String(p.itemId) === idKey) || String(p.name || '').toLowerCase() === nameKey));
  let qSum = 0, cSum = 0;
  ps.forEach(p => {
    const q = num(p.qty), tot = num(p.total) || q * num(p.rate);
    if (q > 0 && tot >= 0) { qSum += q; cSum += tot; }
  });
  if (qSum > 0) return +(cSum / qSum).toFixed(2);
  return num(it?.rate) || 0;
}

// Calculate item stock & consumption metrics for any period [startDate, endDate]
// Formula: Consumption = Opening Stock + Purchases − Closing Stock (verified or book)
function calcPeriodInventoryReportV31(startDate, endDate) {
  ensureV31Store();
  const catalog = new Map();
  db.items.filter(i => !i.deleted).forEach(i => {
    catalog.set(i.name.toLowerCase(), {
      itemId: i.id,
      name: i.name,
      department: i.department || 'Groceries',
      unit: i.unit || 'unit',
      currentBookStock: num(i.stock),
      minStock: num(i.min),
      track: i.track !== false,
      baseRate: num(i.rate)
    });
  });
  db.purchases.filter(p => !p.deleted).forEach(p => {
    const k = String(p.name || '').toLowerCase();
    if (k && !catalog.has(k)) {
      catalog.set(k, {
        itemId: p.itemId || p.name,
        name: p.name,
        department: p.department || 'Groceries',
        unit: p.unit || 'unit',
        currentBookStock: 0,
        minStock: 0,
        track: true,
        baseRate: num(p.rate)
      });
    }
  });
  db.stockMovements.forEach(m => {
    const k = String(m.itemName || '').toLowerCase();
    if (k && !catalog.has(k)) {
      catalog.set(k, {
        itemId: m.itemId || m.itemName,
        name: m.itemName,
        department: m.department || 'Groceries',
        unit: m.unit || 'unit',
        currentBookStock: 0,
        minStock: 0,
        track: true,
        baseRate: num(m.rate)
      });
    }
  });

  const rows = [];
  for (const [k, meta] of catalog.entries()) {
    const moves = db.stockMovements.filter(m => String(m.itemName || '').toLowerCase() === k || (meta.itemId && String(m.itemId) === String(meta.itemId))).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    let beforeNet = 0;
    let purchasedQty = 0, purchasedCost = 0;
    let dailyUsedQty = 0, dailyUsedCost = 0;
    let wastageQty = 0, wastageCost = 0;
    let adjustmentNet = 0; // qtyIn - qtyOut from physical stock counts or corrections
    const shops = new Set();

    moves.forEach(m => {
      const d = String(m.date || '');
      const qIn = num(m.qtyIn), qOut = num(m.qtyOut);
      if (d < startDate) {
        beforeNet += (qIn - qOut);
      } else if (d >= startDate && d <= endDate) {
        if (m.type === 'purchase') {
          purchasedQty += qIn;
          purchasedCost += num(m.totalCost) || (qIn * num(m.rate));
          if (m.shop) shops.add(m.shop);
        } else if (m.type === 'consumption') {
          dailyUsedQty += qOut;
          dailyUsedCost += num(m.totalCost) || (qOut * num(m.rate));
        } else if (m.type === 'wastage') {
          wastageQty += qOut;
          wastageCost += num(m.totalCost) || (qOut * num(m.rate));
        } else if (m.type === 'adjustment') {
          adjustmentNet += (qIn - qOut);
        } else if (m.type === 'return') {
          purchasedQty = Math.max(0, purchasedQty - qOut);
        }
      }
    });

    const openingStock = Math.max(0, +beforeNet.toFixed(3));
    const avgRate = getItemAvgCostV31(meta.name, endDate) || (purchasedQty > 0 ? +(purchasedCost / purchasedQty).toFixed(2) : meta.baseRate);

    // Total actual consumption = daily recorded usage + any unrecorded usage discovered via physical stock verification (where adjustmentNet < 0)
    const unrecordedUsageFromCount = adjustmentNet < 0 ? Math.abs(adjustmentNet) : 0;
    const totalUsedQty = +(dailyUsedQty + unrecordedUsageFromCount).toFixed(3);
    const totalUsedCost = +(totalUsedQty * avgRate).toFixed(2);
    const closingStock = Math.max(0, +(openingStock + purchasedQty - dailyUsedQty - wastageQty + adjustmentNet).toFixed(3));
    const closingValue = +(closingStock * avgRate).toFixed(2);
    const openingValue = +(openingStock * avgRate).toFixed(2);

    if (openingStock > 0 || purchasedQty > 0 || totalUsedQty > 0 || wastageQty > 0 || closingStock > 0 || meta.currentBookStock > 0) {
      rows.push({
        ...meta,
        openingStock,
        openingValue,
        purchasedQty: +purchasedQty.toFixed(3),
        purchasedCost: +purchasedCost.toFixed(2),
        dailyUsedQty: +dailyUsedQty.toFixed(3),
        unrecordedUsageFromCount: +unrecordedUsageFromCount.toFixed(3),
        totalUsedQty,
        totalUsedCost,
        wastageQty: +wastageQty.toFixed(3),
        wastageCost: +(wastageQty * avgRate).toFixed(2),
        adjustmentNet: +adjustmentNet.toFixed(3),
        closingStock,
        closingValue,
        avgRate: +avgRate.toFixed(2),
        shops: [...shops]
      });
    }
  }
  return rows.sort((a, b) => (b.totalUsedCost + b.purchasedCost) - (a.totalUsedCost + a.purchasedCost));
}

    });

      itemId: it.id,

      department: l.department,
      qty: l.qty,
      unit: l.unit,
      rate: l.rate,

  });

  const depts = [...new Set(validLines.map(x => x.department))];

  const summaryNote = `${b.billNo}${b.shop ? ' · ' + b.shop : ''}: ${validLines.map(x => `${x.name} (${x.qty}${x.unit})`).join(', ')}`;

  db.transactions.push({
    id: txId,
    billId,
    billNo: b.billNo,
    type: 'expense',
    amount: grandTotal,
    category: mainCat,
    note: summaryNote.slice(0, 160),
    merchant: b.shop || '',
    paymentMethod: b.paymentMethod || 'UPI',
    date: b.date || today(),
    accountId: b.accountId || db.accounts[0]?.id,
    member: b.member || 'Owner',
    items: txItems
  });

  db.purchaseBills.push({
    id: billId,
    billNo: b.billNo,
    txId,
    date: b.date || today(),
    shop: b.shop || '',
    accountId: b.accountId || db.accounts[0]?.id,
    paymentMethod: b.paymentMethod || 'UPI',
    member: b.member || 'Owner',
    notes: b.notes || '',
    total: grandTotal,
    items: txItems
  });

  V31.billDraft = null;
  save();
  closeModal();
  render();
  toast(`Bill ${b.billNo} saved (${validLines.length} items, ${money(grandTotal)})!`);
}

function applyStockVerificationV31() {
  ensureV31Store();
  const vDate = document.getElementById('v31VerifyDate')?.value || today();
  const inputs = [...document.querySelectorAll('[data-v31verify]')];
  let adjustedCount = 0;
  inputs.forEach(inp => {
    if (inp.value === '' || inp.value === null) return;
    const actual = Math.max(0, parseFloat(inp.value));
    if (!Number.isFinite(actual)) return;
    const it = db.items.find(x => String(x.id) === String(inp.dataset.v31verify));
    if (!it) return;
    const book = num(it.stock);
    const diff = +(actual - book).toFixed(3); // negative means more was consumed than logged daily
    if (Math.abs(diff) < 0.0005) return;
    const rate = getItemAvgCostV31(it, vDate);
    const cost = +(Math.abs(diff) * rate).toFixed(2);
    const vid = uid();
    it.stock = actual;
    it.track = true;
    db.stockVerifications.push({
      id: vid,
      date: vDate,
      itemId: it.id,
      itemName: it.name,
      unit: it.unit,
      bookStock: book,
      actualStock: actual,
      variance: diff,
      rate,
      varianceCost: cost
    });
    db.stockMovements.push({
      id: 'sm-v-' + vid,
      date: vDate,
      itemId: it.id,
      itemName: it.name,
      department: it.department || 'Groceries',
      type: 'adjustment',
      qtyIn: diff > 0 ? diff : 0,
      qtyOut: diff < 0 ? Math.abs(diff) : 0,
      unit: it.unit,
      rate,
      totalCost: cost,
      shop: '',
      refType: 'verification',
      refId: vid,
      note: diff < 0 ? `Physical count consumption (${book} → ${actual} ${it.unit})` : `Stock surplus found (${book} → ${actual} ${it.unit})`
    });
    adjustedCount++;
  });
  if (!adjustedCount) return toast('Kisi bhi item ke stock me badlav nahi mila');
  save();
  closeModal();
  render();
  toast(`${adjustedCount} item(s) reconciled via physical stock count!`);
}

        </tr>`;
        if (hasItems && isOpen) {
          h += `<tr class="erp-subrow"><td colspan="6">
            <div style="margin-bottom:6px"><b>Itemised Bill Breakdown</b> ${t.billNo ? `<span class="pill">${esc(t.billNo)}</span>` : ''} ${t.merchant ? `· Shop: <b>${esc(t.merchant)}</b>` : ''} ${t.member ? `· Purchased by: <b>${esc(t.member)}</b>` : ''}</div>
            <table class="erp-table" style="min-width:420px;background:var(--panel);border-radius:8px;overflow:hidden">
              <thead><tr><th>Item (Kon sa chiz)</th><th>Vibhag</th><th>Matra (Qty)</th><th>Rate</th><th>Total Paisa</th></tr></thead>
              <tbody>
                ${items.map(it => `<tr>
                  <td><b>${esc(it.name)}</b></td>
                  <td>${esc(it.department || 'Groceries')}</td>
                  <td>${fq29(it.qty)} ${esc(it.unit || '')}</td>
                  <td>${money(it.rate || (num(it.qty) ? num(it.total) / num(it.qty) : 0))}/${esc(it.unit || 'unit')}</td>
                  <td><b>${money(it.total || (num(it.qty) * num(it.rate)))}</b></td>
                </tr>`).join('')}
              </tbody>
            </table>
          </td></tr>`;
        }
      });
      return h;
    };
    let g = [];
    sorted.forEach(t => {
      const m = String(t.date || '').slice(0, 7);

// Helper for week start (Monday) and end (Sunday)
function getWeekRangeV31(refDateStr) {
  const d = D(refDateStr || today());
  const dayOffset = (d.getUTCDay() + 6) % 7; // Monday = 0, Sunday = 6
  const start = addD(ds(d), -dayOffset);
  const end = addD(start, 6);
  const prevStart = addD(start, -7);
  const prevEnd = addD(start, -1);
  return { start, end, prevStart, prevEnd };
}

function getMonthRangeV31(ymStr) {
  const ym = /^\d{4}-\d{2}$/.test(ymStr || '') ? ymStr : month();
  const [y, m] = ym.split('-').map(Number);
  const start = `${ym}-01`;
  const end = ds(new Date(Date.UTC(y, m, 0)));
  const prevD = new Date(Date.UTC(y, m - 2, 1));
  const prevYm = `${prevD.getUTCFullYear()}-${pad(prevD.getUTCMonth() + 1)}`;
  const prevStart = `${prevYm}-01`;
  const prevEnd = ds(new Date(Date.UTC(prevD.getUTCFullYear(), prevD.getUTCMonth() + 1, 0)));
  return { ym, start, end, prevYm, prevStart, prevEnd };
}

function renderPeriodConsumptionTableV31(rows, periodLabel, prevRows) {
  const totPurchasedCost = rows.reduce((s, r) => s + r.purchasedCost, 0);
  const totConsumptionCost = rows.reduce((s, r) => s + r.totalUsedCost, 0);
  const totWastageCost = rows.reduce((s, r) => s + r.wastageCost, 0);
  const totClosingVal = rows.reduce((s, r) => s + r.closingValue, 0);
  const totOpeningVal = rows.reduce((s, r) => s + r.openingValue, 0);
  const prevConsumptionCost = prevRows ? prevRows.reduce((s, r) => s + r.totalUsedCost, 0) : 0;
  const prevPurchasedCost = prevRows ? prevRows.reduce((s, r) => s + r.purchasedCost, 0) : 0;
  const diffPct = prevConsumptionCost > 0 ? Math.round(((totConsumptionCost - prevConsumptionCost) / prevConsumptionCost) * 100) : null;

  // Department-wise breakdown
  const deptMap = {};
  rows.forEach(r => {
    const d = r.department || 'Other';
    deptMap[d] = deptMap[d] || { purchased: 0, consumed: 0, wasted: 0 };
    deptMap[d].purchased += r.purchasedCost;
    deptMap[d].consumed += r.totalUsedCost;
    deptMap[d].wasted += r.wastageCost;

  const mostUsed = rows.filter(r => r.totalUsedQty > 0).slice().sort((a, b) => b.totalUsedCost - a.totalUsedCost).slice(0, 5);

  return `
    <div class="card" style="margin-bottom:16px">

        <div class="erp-kpi"><small>Actual Consumption (Use)</small><b class="positive">${money(totConsumptionCost)}</b><span class="muted">${diffPct !== null ? `${diffPct >= 0 ? '▲ +' : '▼ '}${diffPct}% vs prev period` : 'Actual saman used'}</span></div>
        <div class="erp-kpi"><small>Wastage / Loss</small><b class="${totWastageCost > 0 ? 'negative' : ''}">${money(totWastageCost)}</b><span class="muted">Expired / spoiled</span></div>
        <div class="erp-kpi"><small>Closing Stock Value</small><b>${money(totClosingVal)}</b><span class="muted">Remaining stock worth</span></div>
      </div>

      <h4>Item-Wise Consumption & Stock Statement (${esc(periodLabel)})</h4>
      <div class="muted" style="margin-bottom:8px">Har saman kitna pehle se tha (Opening), kitna kharida (Purchased), kitna use hua (Used), kitna bacha (Closing), aur uspar kul kitna paisa laga:</div>
      <div class="table-wrap">
        <table class="erp-table">
          <thead>
            <tr>
              <th>Saman (Item)</th>

function renderMonthlyConsumptionReportV31() {
  const mr = getMonthRangeV31(V31.repMonth);
  const rows = calcPeriodInventoryReportV31(mr.start, mr.end);

  const isClosed = db.monthlyClosings.some(c => c.ym === mr.ym);

  // Shop/Vendor-wise expenditure for this month
  const shopSpend = {};
  db.transactions.filter(t => !t.deleted && t.type === 'expense' && (t.date || '').startsWith(mr.ym)).forEach(t => {

function renderCompanyRegistersV31() {
  ensureV31Store();
  const cashAccs = db.accounts.filter(a => /cash/i.test(a.kind) || /cash/i.test(a.name)).map(a => a.id);
  const liveTx = db.transactions.filter(t => !t.deleted).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const cashBook = liveTx.filter(t => cashAccs.includes(t.accountId) || cashAccs.includes(t.toAccountId));
  const bankBook = liveTx.filter(t => !cashAccs.includes(t.accountId));

  // Vendor ledger aggregation
  const vendorsMap = {};
  liveTx.filter(t => t.type === 'expense').forEach(t => {
    const v = t.merchant || 'Direct / Unspecified Vendor';
    vendorsMap[v] = vendorsMap[v] || { count: 0, total: 0, lastDate: t.date, items: 0 };
    vendorsMap[v].count++;
    vendorsMap[v].total += num(t.amount);
    vendorsMap[v].items += (Array.isArray(t.items) ? t.items.length : 0);
    if (t.date > vendorsMap[v].lastDate) vendorsMap[v].lastDate = t.date;
  });

  return `
    <div class="card" style="margin-bottom:16px">
      <h3>Company-Style Financial Books & Registers</h3>
      <div class="grid two">
        <div class="card" style="background:var(--panel2)">
          <h4>💵 Cash Book (${cashBook.length} entries)</h4>
          <div class="table-wrap" style="max-height:260px;overflow:auto">
            <table class="erp-table" style="min-width:380px">
              <thead><tr><th>Date</th><th>Particulars</th><th>In/Out</th></tr></thead>
              <tbody>
                ${cashBook.slice(0, 30).map(t => `<tr>
                  <td>${esc(t.date)}</td>
                  <td><b>${esc(t.note || t.category)}</b>${t.merchant ? `<div class="muted">${esc(t.merchant)}</div>` : ''}</td>
                  <td class="${t.type === 'income' ? 'positive' : 'negative'}">${t.type === 'income' ? '+' : '−'}${money(t.amount)}</td>
                </tr>`).join('') || `<tr><td colspan="3" class="muted">No cash entries</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
        <div class="card" style="background:var(--panel2)">
          <h4>🏦 Bank & UPI Book (${bankBook.length} entries)</h4>
          <div class="table-wrap" style="max-height:260px;overflow:auto">
            <table class="erp-table" style="min-width:380px">
              <thead><tr><th>Date</th><th>Particulars</th><th>Account</th><th>In/Out</th></tr></thead>
              <tbody>
                ${bankBook.slice(0, 30).map(t => `<tr>
                  <td>${esc(t.date)}</td>
                  <td><b>${esc(t.note || t.category)}</b>${t.merchant ? `<div class="muted">${esc(t.merchant)}</div>` : ''}</td>
                  <td>${esc(accountName(t.accountId))}</td>
                  <td class="${t.type === 'income' ? 'positive' : 'negative'}">${t.type === 'income' ? '+' : '−'}${money(t.amount)}</td>
                </tr>`).join('') || `<tr><td colspan="4" class="muted">No bank/UPI entries</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <h4 style="margin-top:18px">🏪 Vendor / Shop Ledger (Kaha Se Kitna Saman Liya)</h4>
      <div class="table-wrap">
        <table class="erp-table">
          <thead><tr><th>Vendor / Shop Name</th><th>Bills / Transactions</th><th>Line Items Bought</th><th>Last Purchase Date</th><th>Total Paid (₹)</th></tr></thead>
          <tbody>
            ${Object.entries(vendorsMap).sort((a, b) => b[1].total - a[1].total).map(([v, d]) => `<tr>
              <td><b>${esc(v)}</b></td>
              <td>${d.count}</td>
              <td>${d.items}</td>
              <td>${esc(d.lastDate)}</td>
              <td><b>${money(d.total)}</b></td>
            </tr>`).join('') || `<tr><td colspan="5" class="muted">No vendor records yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

      db.purchases.push(pRec);

        id: txId,
        type: 'expense',

        category: i.department === 'Puja' ? 'Puja' : i.department === 'Groceries' ? 'Groceries' : i.department,
        note: `${i.name} · ${qty} ${i.unit}`,
        merchant: d.shop,
        date: d.date,
        accountId: d.accountId,
        member: d.member,
        items: [{ purchaseId: pid, itemId: i.id, name: i.name, department: i.department, qty, unit: i.unit, rate, total }]
      });
      ensureV31Store();
      save();
      closeModal();
      render();
      toast('Purchase recorded, stock updated & linked to expense ledger!');
    });
  };
}

// Event listeners for V31 actions and inputs
document.addEventListener('click', e => {
  const repBtn = e.target.closest('[data-v31rep]');
  if (repBtn) {
    V31.repMode = repBtn.dataset.v31rep;
    render();
    return;
  }
  const actBtn = e.target.closest('[data-v31act]');
  if (!actBtn) return;
  const [act, arg] = actBtn.dataset.v31act.split(/:(.*)/);

  if (act === 'open-bill') return openBillBuilderV31();
  if (act === 'add-line') {
    if (V31.billDraft) {
      const lastDept = V31.billDraft.lines[V31.billDraft.lines.length - 1]?.department || 'Groceries';
      V31.billDraft.lines.push({ name: '', department: lastDept, qty: 1, unit: 'kg', rate: '', total: 0 });
      renderBillModalV31();
    }
    return;
  }
  if (act === 'rm-line') {
    if (V31.billDraft && V31.billDraft.lines.length > 1) {
      V31.billDraft.lines.splice(+arg, 1);
      renderBillModalV31();
    }
    return;
  }
  if (act === 'save-bill') return saveBillBuilderV31();
  if (act === 'open-usage') return openDailyUsageModalV31();
  if (act === 'use-item') return openDailyUsageModalV31(arg);
  if (act === 'open-verify') return openStockVerificationModalV31();
  if (act === 'apply-stock-verify') return applyStockVerificationV31();
  if (act === 'toggle-tx') {
    if (V31.expandedTx.has(arg)) V31.expandedTx.delete(arg);
    else V31.expandedTx.add(arg);
    render();
    return;
  }
  if (act === 'week-step') {
    V31.repWeekDate = addD(V31.repWeekDate || today(), +arg);
    render();
    return;
  }

// 1. Smart Unit Auto-Converter (converts g <-> kg, ml <-> litre to match item's base unit or standard unit)
function convertUnitV32(qty, fromUnit, targetUnit) {
  let q = num(qty);
  let uFrom = String(fromUnit || '').toLowerCase().trim();
  let uTo = String(targetUnit || '').toLowerCase().trim();
  const mapU = {
    kilo: 'kg', kilogram: 'kg', kgs: 'kg', kg: 'kg',
    gram: 'g', grams: 'g', gm: 'g', gms: 'g', g: 'g',
    liter: 'litre',iters: 'litre', ltr: 'litre', l: 'litre', litre: 'litre',
    milliliter: 'ml', millilitre: 'ml', ml: 'ml',
    pcs: 'piece', pc: 'piece', pieces: 'piece', piece: 'piece',
    pkt: 'packet', packets: 'packet', packet: 'packet',
    dzn: 'dozen', dozen: 'dozen',
    btl: 'bottle', bottle: 'bottle',
    box: 'box', roll: 'roll', set: 'set'
  };
  uFrom = mapU[uFrom] || uFrom || 'kg';
  uTo = mapU[uTo] || uTo || (uFrom === 'g' ? 'kg' : uFrom === 'ml' ? 'litre' : uFrom);

  if (uFrom === uTo) return { qty: +q.toFixed(4), unit: uTo };
  if (uFrom === 'g' && uTo === 'kg') return { qty: +(q / 1000).toFixed(4), unit: 'kg' };
  if (uFrom === 'kg' && uTo === 'g') return { qty: +(q * 1000).toFixed(2), unit: 'g' };
  if (uFrom === 'ml' && uTo === 'litre') return { qty: +(q / 1000).toFixed(4), unit: 'litre' };
  if (uFrom === 'litre' && uTo === 'ml') return { qty: +(q * 1000).toFixed(2), unit: 'ml' };
  return { qty: +q.toFixed(4), unit: uFrom };
}

// 2. Burn-Rate & Days-Left Predictor for any item
function getItemBurnStatsV32(item) {
  const cutoff = addD(today(), -60);
  const k = String(item.name || '').toLowerCase();
  const moves = (db.stockMovements || []).filter(m =>
    (String(m.itemId) === String(item.id) || String(m.itemName || '').toLowerCase() === k) &&
    (m.type === 'consumption' || (m.type === 'adjustment' && num(m.qtyOut) > 0)) &&
    String(m.date || '') >= cutoff
  );
  const totalOut = moves.reduce((s, m) => s + num(m.qtyOut), 0);
  let dailyBurn = 0;
  if (totalOut > 0) {
    const earliest = moves.map(m => m.date).sort()[0] || today();
    const spanDays = Math.max(7, Math.round((D(today()) - D(earliest)) / 864e5) + 1);
    dailyBurn = +(totalOut / spanDays).toFixed(3);
  }
  const curStock = num(item.stock);
  const daysLeft = dailyBurn > 0 ? Math.max(0, Math.round(curStock / dailyBurn)) : null;
  return { dailyBurn, daysLeft, totalOut60d: +totalOut.toFixed(2) };
}

// 3. Price Hike / Shrinkflation Radar
function checkPriceHikeV32(itemName, newUnitRate, unit) {
  const avg = getItemAvgCostV31(itemName);
  if (avg > 0 && newUnitRate > avg * 1.04) {
    const pct = Math.round(((newUnitRate - avg) / avg) * 100);
    return `⚠ Price Hike: Pichla ausat rate ${money(avg)}/${unit || 'unit'} tha, ab ${money(newUnitRate)} (+${pct}% mehenga)`;
  }
  if (avg > 0 && newUnitRate < avg * 0.95) {
    const pct = Math.round(((avg - newUnitRate) / avg) * 100);
    return `✓ Sasta mila: Pichle ausat ${money(avg)} se ${pct}% kam daam!`;
  }
  return '';
}

// 4. 1-Click Monthly Rashan List Generator (Strictly filters out Yearly / Occasional / Archived items!)
function generateMonthlyRashanListV32() {
  ensureV32Store();
  saveUndoSnapshotV32('Monthly Rashan List');
  let addedCount = 0;
  db.items.filter(i =>
    !i.deleted &&
    !i.archived &&
    (i.frequency === 'Monthly / Regular' || i.frequency === 'Weekly / Fresh') &&
    i.track !== false
  ).forEach(i => {
    const stock = num(i.stock), min = num(i.min) || 1;
    const burn = getItemBurnStatsV32(i);
    const monthlyNeed = burn.dailyBurn > 0 ? +(burn.dailyBurn * 30).toFixed(1) : Math.max(min * 2, 1);
    if (stock <= min || (burn.daysLeft !== null && burn.daysLeft <= 10)) {
      const toBuyQty = Math.max(+(monthlyNeed - stock).toFixed(2), min, 1);
      if (!db.shopping.some(s => !s.done && s.name.toLowerCase() === i.name.toLowerCase())) {
        const avgR = getItemAvgCostV31(i) || num(i.rate) || 0;
        db.shopping.push({
          id: uid(),
          name: i.name,
          department: i.department || 'Groceries',
          qty: toBuyQty,
          unit: i.unit || 'kg',
          estimate: +(toBuyQty * avgR).toFixed(2),
          frequency: i.frequency,
          done: false
        });
        addedCount++;
      }
    }
  });
  save();
  render();
  toast(addedCount
    ? `✓ ${addedCount} Monthly/Weekly items Shopping List me add ho gaye (Yearly/Occasional items skip kiye gaye)!`
    : 'Sabhi Monthly/Weekly items ka stock abhi paryapt (sufficient) hai!');
}

// 10. Super-Powered Natural Language AI ERP Operator (Works 100% Offline in Hinglish/Hindi/English + Online LLM!)
function executeNaturalLanguageCommandV32(rawText) {
  ensureV32Store();
  const text = String(rawText || '').trim();
  if (!text) return { ok: false, msg: 'Kपया कोई कमांड लिखें या बोलें' };

  saveUndoSnapshotV32(text);
  const lower = text.toLowerCase();
  const actionsTaken = [];

  // A. Check for Theme / Mode / Navigation commands
  if (/\b(forest|pink|navy|lavender)\b/.test(lower) && /\b(theme|color|colour|lagao|karo|set|change|badlo)\b/.test(lower)) {
    const th = lower.match(/\b(forest|pink|navy|lavender)\b/)[1];
    db.settings.theme = th;
    applyTheme();
    actionsTaken.push(`Theme changed to ${th.toUpperCase()}`);
  }
  if (/\b(light mode|dark mode|light kar|dark kar)\b/.test(lower)) {
    db.settings.mode = /light/.test(lower) ? 'light' : 'dark';
    applyTheme();
    actionsTaken.push(`Display mode set to ${db.settings.mode}`);
  }
  if (/\b(weekly report|hafte ki report|week report)\b/.test(lower)) {
    V31.repMode = 'weekly';
    setPage('reports');
    actionsTaken.push('Opened Weekly Consumption Report');
  } else if (/\b(monthly report|mahine ki report|month report)\b/.test(lower)) {
    V31.repMode = 'monthly';
    setPage('reports');
    actionsTaken.push('Opened Monthly Consumption Report');
  }

  // B. Check for Item Frequency / Archive / Delete / Shopping List Delete commands
  // e.g., "diwali diya ko yearly me daal do", "maggi shopping list se delete karo", "holi gulal archive kar do"
  const clauses = text.split(/,|\band\b|\baur\b|\n|;/i).map(s => s.trim()).filter(Boolean);

  // Extract global shop/merchant and payment mode if mentioned in the sentence
  let globalShop = '';
  const shopMatch = text.match(/(?:@|from\s+|se\s+liya|dukaan\s+|shop\s+)([a-zA-Z0-9\u0900-\u097F ]{2,25})/i) ||
                    text.match(/([a-zA-Z0-9\u0900-\u097F ]{2,22})\s+(?:se|dukaan se|store se)\b/i);
  if (shopMatch && !/^(upi|cash|bank|gpay|phonepe|paytm|aaj|kal|parso|ghar)$/i.test(shopMatch[1].trim())) {
    globalShop = cap30(shopMatch[1].trim());
  }
  const isUPI = /\b(upi|gpay|phonepe|paytm|online)\b/i.test(lower);
  const isCash = /\b(cash|naqad|nakad)\b/i.test(lower);
  const payMode = isUPI ? 'UPI' : isCash ? 'Cash' : 'UPI';
  const targetAcc = isCash
    ? (db.accounts.find(a => /cash/i.test(a.kind)) || db.accounts[0])
    : (db.accounts.find(a => /bank|upi|wallet/i.test(a.kind)) || db.accounts[0]);

  const purchaseBatch = [];

  for (const clStr of clauses) {
    const clLow = clStr.toLowerCase();

    // 1. Delete from shopping list or inventory
    if (/\b(delete|hatao|hata do|remove|nikal do)\b/.test(clLow)) {
      const cleanName = clLow
        .replace(/\b(shopping list|list|inventory|saman|item|me|se|ko|delete|hatao|hata|do|karo|remove|nikal|poora)\b/g, ' ')
        .replace(/\s+/g, ' ').trim();
      if (cleanName) {
        const beforeShop = db.shopping.length;
        db.shopping = db.shopping.filter(s => !s.name.toLowerCase().includes(cleanName));
        if (db.shopping.length < beforeShop) {
          actionsTaken.push(`Shopping list se "${cleanName}" hata diya`);
          continue;
        }
        const matchIt = db.items.find(i => !i.deleted && i.name.toLowerCase().includes(cleanName));
        if (matchIt) {
          db.items = db.items.filter(i => i.id !== matchIt.id);
          actionsTaken.push(`Inventory se "${matchIt.name}" delete kar diya`);
          continue;
        }
      }
    }

    // 2. Archive / Hide or Change Frequency (Yearly / Monthly / Quarterly / Occasional / Weekly)
    if (/\b(yearly|festival|saal me|annual|occasional|kabhi kabhi|quarterly|monthly|regular|weekly|archive|hide|chhupa|unarchive)\b/.test(clLow) && !/\b(report)\b/.test(clLow)) {
      let targetFreq = null;
      if (/\b(yearly|festival|saal|annual)\b/.test(clLow)) targetFreq = 'Yearly / Festival';
      else if (/\b(occasional|one-time|kabhi)\b/.test(clLow)) targetFreq = 'Occasional / One-time';
      else if (/\b(quarterly)\b/.test(clLow)) targetFreq = 'Quarterly (2-3 months)';
      else if (/\b(weekly|fresh)\b/.test(clLow)) targetFreq = 'Weekly / Fresh';
      else if (/\b(monthly|regular)\b/.test(clLow)) targetFreq = 'Monthly / Regular';

      const wantArchive = /\b(archive|hide|chhupa)\b/.test(clLow) && !/\bunarchive\b/.test(clLow);
      const wantUnarchive = /\bunarchive\b/.test(clLow);

      const itemNameGuess = clLow
        .replace(/\b(ko|ka|ki|me|mein|set|daal|daalo|kar|karo|do|frequency|cadence|yearly|festival|saal|annual|occasional|kabhi|quarterly|monthly|regular|weekly|fresh|archive|unarchive|hide|chhupa)\b/g, ' ')
        .replace(/\s+/g, ' ').trim();

      if (itemNameGuess) {
        let it = db.items.find(i => !i.deleted && i.name.toLowerCase().includes(itemNameGuess));
        if (!it) {
          it = {
            id: uid(),
            name: cap30(itemNameGuess),
            department: targetFreq === 'Yearly / Festival' ? 'Puja' : 'Groceries',
            subcategory: 'General',
            unit: 'piece',
            rate: 0,
            stock: 0,
            min: 0,
            frequency: targetFreq || 'Yearly / Festival',
            track: true,
            archived: wantArchive,
            photo: ''
          };
          db.items.push(it);
        } else {
          if (targetFreq) it.frequency = targetFreq;
          if (wantArchive) it.archived = true;
          if (wantUnarchive) it.archived = false;
        }
        actionsTaken.push(`${it.name} → ${it.frequency}${it.archived ? ' (Archived)' : ''}`);
        continue;
      }
    }

    // 3. Add to Shopping List ("2 kg chini list me daalo")
    if (/\b(shopping list|list me|to buy)\b/.test(clLow) && /\b(daalo|daal do|add|jodo|likho)\b/.test(clLow)) {
      const parsed = pLine30(clStr.replace(/\b(shopping list|list me|to buy|daalo|daal do|add|jodo|likho)\b/gi, ' '));
      if (parsed.name) {
        const q = num(parsed.qty) || 1;
        const u = parsed.unit || 'kg';
        db.shopping.push({
          id: uid(),
          name: parsed.name,
          department: 'Groceries',
          qty: q,
          unit: u,
          estimate: num(parsed.total) || 0,
          done: false
        });
        actionsTaken.push(`Shopping list me "${parsed.name} (${q} ${u})" joda gaya`);
        continue;
      }
    }

    // 4. Physical Stock Verification ("dabbe me 3.5 kg chawal bacha hai")
    if (/\b(bacha hai|bache hain|remaining|left in stock|physical stock)\b/.test(clLow)) {
      const parsed = pLine30(clStr.replace(/\b(abhi|dabbe me|ghar me|bacha hai|bache hain|remaining|left in stock|physical stock)\b/gi, ' '));
      if (parsed.name && parsed.qty !== '') {
        let it = db.items.find(i => !i.deleted && i.name.toLowerCase().includes(parsed.name.toLowerCase()));
        if (it) {
          const conv = convertUnitV32(parsed.qty, parsed.unit || it.unit, it.unit);
          const book = num(it.stock);
          const actual = conv.qty;
          const diff = +(actual - book).toFixed(3);
          const rate = getItemAvgCostV31(it);
          const cost = +(Math.abs(diff) * rate).toFixed(2);
          it.stock = actual;
          const vid = uid();
          db.stockVerifications.push({ id: vid, date: today(), itemId: it.id, itemName: it.name, unit: it.unit, bookStock: book, actualStock: actual, variance: diff, rate, varianceCost: cost });
          db.stockMovements.push({
            id: 'sm-v-' + vid,
            date: today(),
            itemId: it.id,
            itemName: it.name,
            department: it.department || 'Groceries',
            type: 'adjustment',
            qtyIn: diff > 0 ? diff : 0,
            qtyOut: diff < 0 ? Math.abs(diff) : 0,
            unit: it.unit,
            rate,
            totalCost: cost,
            shop: '',
            refType: 'verification',
            refId: vid,
            note: `AI Stock Count (${book} → ${actual} ${it.unit})`
          });
          actionsTaken.push(`${it.name} stock verified: ${actual} ${it.unit} (${diff < 0 ? Math.abs(diff) + ' ' + it.unit + ' consumed' : 'reconciled'})`);
          continue;
        }
      }
    }

    // 5. Daily Consumption or Wastage ("500 gm chawal use hua", "1 litre doodh kharab ho gaya")
    if (/\b(use hua|use kiya|istemal|khapat|consumed|used|bana|banaya|kharab|waste|expire|gir gaya)\b/.test(clLow)) {
      const isWaste = /\b(kharab|waste|expire|gir gaya|spoiled)\b/.test(clLow);
      const cleanUsageStr = clStr.replace(/\b(aaj|kal|ghar me|rasoi me|use hua|use kiya|istemal|khapat|consumed|used|bana|banaya|kharab ho gaya|kharab|waste|expire|gir gaya)\b/gi, ' ');
      const parsed = pLine30(cleanUsageStr);
      const uName = parsed.name || cleanUsageStr.replace(/\d+(?:\.\d+)?/g, '').trim();
      const rawQty = num(parsed.qty) || num(parsed.total);
      if (uName && rawQty > 0) {
        let it = db.items.find(i => !i.deleted && i.name.toLowerCase().includes(uName.toLowerCase()));
        const baseU = it ? it.unit : (parsed.unit === 'g' ? 'kg' : parsed.unit === 'ml' ? 'litre' : (parsed.unit || 'kg'));
        const conv = convertUnitV32(rawQty, parsed.unit || baseU, baseU);
        if (!it) {
          it = { id: uid(), name: cap30(uName), department: 'Groceries', subcategory: 'General', unit: conv.unit, rate: 50, stock: conv.qty, min: 1, frequency: 'Monthly / Regular', track: true, archived: false, photo: '' };
          db.items.push(it);
        }
        const rate = getItemAvgCostV31(it, parsed.date || today()) || num(it.rate) || 0;
        const cost = +(conv.qty * rate).toFixed(2);
        it.stock = Math.max(0, +(num(it.stock) - conv.qty).toFixed(3));
        const logId = uid();
        const mType = isWaste ? 'wastage' : 'consumption';
        if (isWaste) {
          S25().waste.push({ id: logId, itemId: it.id, name: it.name, qty: conv.qty, unit: it.unit, cost, date: parsed.date || today(), reason: 'AI logged wastage' });
        } else {
          db.consumptionLogs.push({ id: logId, date: parsed.date || today(), itemId: it.id, itemName: it.name, department: it.department || 'Groceries', qty: conv.qty, unit: it.unit, rate, cost, note: 'AI logged usage' });
        }
        db.stockMovements.push({
          id: 'sm-u-' + logId,
          date: parsed.date || today(),
          itemId: it.id,
          itemName: it.name,
          department: it.department || 'Groceries',
          type: mType,
          qtyIn: 0,
          qtyOut: conv.qty,
          unit: it.unit,
          rate,
          totalCost: cost,
          shop: '',
          refType: mType,
          refId: logId,
          note: isWaste ? 'Wastage (AI)' : 'Daily usage (AI)'
        });
        actionsTaken.push(`${isWaste ? 'Wastage' : 'Used'}: ${it.name} ${conv.qty} ${it.unit} (${money(cost)})`);
        continue;
      }
    }

    // 6. Itemised Purchase ("10 kg aata 440 rs", "2 litre tel 310", "doodh 1 litre 60")
    const cleanedPurchaseClause = clStr
      .replace(new RegExp(globalShop ? globalShop.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '^$', 'i'), ' ')
      .replace(/\b(upi se|cash se|bank se|dukaan se|store se|liya|kharida|laya|bought|purchased)\b/gi, ' ');
    const p = pLine30(cleanedPurchaseClause);
    if (p.name && num(p.total) > 0) {
      purchaseBatch.push({
        name: p.name,
        qty: num(p.qty) || 1,
        unit: p.unit || 'piece',
        total: num(p.total),
        date: p.date || today(),
        shop: p.shop || globalShop
      });
    }
  }

  // Process collected purchaseBatch as one combined Itemised Bill + Stock Inward + Expense Transaction!
  if (purchaseBatch.length > 0) {
    const billNo = 'BILL-' + String((db.purchaseBills?.length || 0) + 1).padStart(3, '0');
    const billId = uid(), txId = uid();
    const txItems = [];
    let grandTotal = 0;
    const bDate = purchaseBatch[0].date || today();
    const bShop = purchaseBatch.find(x => x.shop)?.shop || globalShop || '';

    purchaseBatch.forEach(itemP => {
      let it = db.items.find(i => !i.deleted && i.name.toLowerCase() === itemP.name.toLowerCase());
      const targetU = it ? it.unit : (itemP.unit === 'g' ? 'kg' : itemP.unit === 'ml' ? 'litre' : itemP.unit);
      const conv = convertUnitV32(itemP.qty, itemP.unit, targetU);
      const unitRate = conv.qty > 0 ? +(itemP.total / conv.qty).toFixed(2) : itemP.total;
      const hikeWarning = checkPriceHikeV32(itemP.name, unitRate, conv.unit);
      if (hikeWarning) actionsTaken.push(hikeWarning);

      if (!it) {
        it = {
          id: uid(),
          name: itemP.name,
          department: 'Groceries',
          subcategory: 'General',
          unit: conv.unit,
          rate: unitRate,
          stock: 0,
          min: 1,
          frequency: 'Monthly / Regular',
          track: true,
          archived: false,
          photo: ''
        };
        db.items.push(it);
      } else {
        it.rate = unitRate;
        it.archived = false;
      }
      if (it.track !== false) {
        it.track = true;
        it.stock = +((num(it.stock) || 0) + conv.qty).toFixed(3);
      }

      const pid = uid();
      db.purchases.push({
        id: pid,
        billId,
        txId,
        itemId: it.id,
        name: it.name,
        department: it.department,
        subcategory: it.subcategory,
        qty: conv.qty,
        unit: conv.unit,
        rate: unitRate,
        total: itemP.total,
        date: bDate,
        shop: bShop,
        member: db.family[0]?.name || 'Owner',
        paymentMethod: payMode,
        manual: true
      });
      db.stockMovements.push({
        id: 'sm-p-' + pid,
        date: bDate,
        itemId: it.id,
        itemName: it.name,
        department: it.department,
        type: 'purchase',
        qtyIn: conv.qty,
        qtyOut: 0,
        unit: conv.unit,
        rate: unitRate,
        totalCost: itemP.total,
        shop: bShop,
        refType: 'purchase',
        refId: pid,
        txId,
        note: `AI Bill ${billNo}${bShop ? ' @ ' + bShop : ''}`
      });
      txItems.push({
        purchaseId: pid,
        itemId: it.id,
        name: it.name,
        department: it.department,
        qty: conv.qty,
        unit: conv.unit,
        rate: unitRate,
        total: itemP.total
      });
      // Also mark matching shopping list item as done!
      db.shopping.forEach(s => {
        if (!s.done && s.name.toLowerCase() === it.name.toLowerCase()) s.done = true;
      });
      grandTotal += itemP.total;
    });

    grandTotal = +grandTotal.toFixed(2);
    const summaryNote = `${billNo}${bShop ? ' · ' + bShop : ''}: ${txItems.map(x => `${x.name} (${x.qty}${x.unit})`).join(', ')}`;
    db.transactions.push({
      id: txId,
      billId,
      billNo,
      type: 'expense',
      amount: grandTotal,
      category: 'Groceries',
      note: summaryNote.slice(0, 160),
      merchant: bShop,
      paymentMethod: payMode,
      date: bDate,
      accountId: targetAcc?.id || db.accounts[0]?.id,
      member: db.family[0]?.name || 'Owner',
      items: txItems
    });
    db.purchaseBills.push({
      id: billId,
      billNo,
      txId,
      date: bDate,
      shop: bShop,
      accountId: targetAcc?.id || db.accounts[0]?.id,
      paymentMethod: payMode,
      member: db.family[0]?.name || 'Owner',
      notes: 'Created via AI ERP Operator',
      total: grandTotal,
      items: txItems
    });
    actionsTaken.unshift(`🧾 Bill ${billNo} saved (${txItems.length} item(s), Total ${money(grandTotal)}${bShop ? ' @ ' + bShop : ''}) & Stock updated`);
  }

  if (!actionsTaken.length) {
    return { ok: false, msg: 'Command samajh nahi aaya. Example: "dmart se 5kg aata 220 rs liya" ya "500g chawal use hua"' };
  }

  save();
  render();
  return { ok: true, msg: actionsTaken.join(' · ') };
}

// ===== FEATURE #6: FIFO (First-In, First-Out) Batch & Expiry Engine =====
function deductStockFIFOV33(itemIdOrName, qtyToDeduct) {
  ensureV33Store();
  let rem = num(qtyToDeduct);
  if (!(rem > 0)) return [];
  const k = String(itemIdOrName || '').toLowerCase();
  const itemBatches = db.batches.filter(b =>
    num(b.remainingQty) > 0 &&
    (String(b.itemId) === String(itemIdOrName) || String(b.itemName || '').toLowerCase() === k)
  ).sort((a, b) => {
    if (a.expiryDate && b.expiryDate) return a.expiryDate.localeCompare(b.expiryDate);
    if (a.expiryDate) return -1;
    if (b.expiryDate) return 1;
    return String(a.date || '').localeCompare(String(b.date || ''));
  });

  const usedBatches = [];
  for (const bat of itemBatches) {
    if (rem <= 0) break;
    const avail = num(bat.remainingQty);
    const take = Math.min(avail, rem);
    bat.remainingQty = +(avail - take).toFixed(3);
    rem = +(rem - take).toFixed(3);
    usedBatches.push({ batchNo: bat.batchNo, taken: take, rate: bat.rate, expiryDate: bat.expiryDate });
  }
  return usedBatches;
}

function getFIFOAlertsV33(withinDays = 15) {
  ensureV33Store();
  const t0 = D(today());
  const alerts = [];
  db.batches.filter(b => num(b.remainingQty) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(b.expiryDate || '')).forEach(b => {
    const daysLeft = Math.round((D(b.expiryDate) - t0) / 864e5);
    if (daysLeft <= withinDays) {
      alerts.push({
        ...b,
        daysLeft,
        expired: daysLeft < 0,
        worth: +(num(b.remainingQty) * num(b.rate)).toFixed(2)
      });
    }
  });
  return alerts.sort((a, b) => a.daysLeft - b.daysLeft);
}

function getItemEarliestBatchV33(item) {
  const k = String(item.name || '').toLowerCase();
  const active = db.batches.filter(b =>

    if (a.expiryDate) return -1;
    if (b.expiryDate) return 1;
    return String(a.date || '').localeCompare(String(b.date || ''));
  });
  return active[0] || null;
}

// ===== FEATURE #4: "Dukaandar Parchi" & Split-Shop Optimizer =====
function getBestShopForItemV33(itemName) {
  const k = String(itemName || '').toLowerCase().trim();
  const ps = db.purchases.filter(p => !p.deleted && p.shop && num(p.qty) > 0 && num(p.rate) > 0 && String(p.name || '').toLowerCase().trim() === k);
  if (!ps.length) return { bestShop: 'General / Local Kirana', bestRate: 0, worstShop: '', worstRate: 0, savingPerUnit: 0 };
  const byShop = {};
  ps.forEach(p => {
    const sKey = String(p.shop).trim().toLowerCase();
    const o = byShop[sKey] = byShop[sKey] || { label: String(p.shop).trim(), q: 0, tot: 0 };
    o.q += num(p.qty);
    o.tot += num(p.qty) * num(p.rate);
  });
  const list = Object.values(byShop).map(o => ({ shop: o.label, avgRate: +(o.tot / o.q).toFixed(2) })).sort((a, b) => a.avgRate - b.avgRate);
  const best = list[0];
  const worst = list[list.length - 1];
  return {
    bestShop: best.shop,
    bestRate: best.avgRate,
    worstShop: list.length > 1 ? worst.shop : '',
    worstRate: list.length > 1 ? worst.avgRate : best.avgRate,
    savingPerUnit: list.length > 1 ? +(worst.avgRate - best.avgRate).toFixed(2) : 0
  };
}

function computeSplitShopGroupsV33() {
  ensureV33Store();
  const toBuy = db.shopping.filter(x => !x.done);
  const groups = {};
  let totalPotentialSavings = 0;

  toBuy.forEach(item => {
    const intel = getBestShopForItemV33(item.name);
    const shopName = intel.bestShop || 'General / Local Kirana';
    const qty = num(item.qty) || 1;
    const itCat = db.items.find(i => !i.deleted && i.name.toLowerCase() === item.name.toLowerCase());
    const estUnitRate = intel.bestRate || getItemAvgCostV31(item.name) || num(itCat?.rate) || (num(item.estimate) / qty) || 0;
    const estTotal = +(qty * estUnitRate).toFixed(2);
    const saved = +(qty * intel.savingPerUnit).toFixed(2);
    totalPotentialSavings += saved;

    groups[shopName] = groups[shopName] || { shop: shopName, items: [], totalEstimate: 0, totalSaved: 0 };
    groups[shopName].items.push({
      ...item,
      estUnitRate,
      estTotal,
      worstShop: intel.worstShop,
      worstRate: intel.worstRate,
      saved
    });
    groups[shopName].totalEstimate = +(groups[shopName].totalEstimate + estTotal).toFixed(2);
    groups[shopName].totalSaved = +(groups[shopName].totalSaved + saved).toFixed(2);
  });

  return { groups: Object.values(groups).sort((a, b) => b.totalEstimate - a.totalEstimate), totalPotentialSavings: +totalPotentialSavings.toFixed(2) };
}

// ===== FEATURE #5: True Household Master Balance Sheet & Per-Person Daily Cost =====
function calcHouseholdBalanceSheetV33(ymStr = V31.repMonth || month()) {
  ensureV33Store();
  const mr = getMonthRangeV31(ymStr);
  const invRows = calcPeriodInventoryReportV31(mr.start, mr.end);

  // Assets
  const cashAccs = db.accounts.filter(a => /cash/i.test(a.kind) || /cash/i.test(a.name));
  const bankAccs = db.accounts.filter(a => !(/cash/i.test(a.kind) || /cash/i.test(a.name)));
  const cashBal = cashAccs.reduce((s, a) => s + accountBalance(a.id), 0);
  const bankBal = bankAccs.reduce((s, a) => s + accountBalance(a.id), 0);
  const inventoryVal = invRows.reduce((s, r) => s + r.closingValue, 0);
  const receivables = db.debts.filter(d => !d.deleted && d.direction === 'lent').reduce((s, d) => s + num(d.outstanding), 0);
  const goalsSaved = db.goals.filter(g => !g.deleted).reduce((s, g) => s + num(g.saved), 0);
  const totalAssets = +(cashBal + bankBal + inventoryVal + receivables + goalsSaved).toFixed(2);

  // Liabilities
  const loansPayable = db.debts.filter(d => !d.deleted && d.direction === 'borrowed').reduce((s, d) => s + num(d.outstanding), 0);
  const unpaidBills = db.bills.filter(b => !b.deleted && b.status !== 'Paid').reduce((s, b) => s + num(b.amount), 0);
  const totalLiabilities = +(loansPayable + unpaidBills).toFixed(2);
  const netEquity = +(totalAssets - totalLiabilities).toFixed(2);

  // Per-Person Daily Cost & Festival vs Normal Analysis
  const famCount = Math.max(1, (db.family || []).length);
  const daysElapsed = mr.ym === month() ? Math.max(1, new Date().getDate()) : +mr.end.slice(8, 10);
  const totalConsumedCost = invRows.reduce((s, r) => s + r.totalUsedCost, 0);
  const totalMonthExpense = sumA(monthTx(mr.ym, 'expense'));

  let festivalSpend = 0, normalConsumptionCost = 0;
  invRows.forEach(r => {
    const itObj = db.items.find(i => i.name.toLowerCase() === r.name.toLowerCase());
    if (r.department === 'Puja' || itObj?.frequency === 'Yearly / Festival') {
      festivalSpend += (r.totalUsedCost || r.purchasedCost);
    } else {
      normalConsumptionCost += r.totalUsedCost;
    }
  });

  const perPersonDailyKitchen = +(totalConsumedCost / (famCount * daysElapsed)).toFixed(2);
  const perPersonDailyTotal = +(totalMonthExpense / (famCount * daysElapsed)).toFixed(2);

  return {
    ym: mr.ym,
    cashBal, bankBal, inventoryVal, receivables, goalsSaved, totalAssets,
    loansPayable, unpaidBills, totalLiabilities, netEquity,
    famCount, daysElapsed, totalConsumedCost, totalMonthExpense,
    festivalSpend: +festivalSpend.toFixed(2),
    normalConsumptionCost: +normalConsumptionCost.toFixed(2),
    perPersonDailyKitchen, perPersonDailyTotal
  };
}

      total: +(q * r).toFixed(2)

  }).filter(l => l.name && l.qty > 0 && l.total > 0);

  if (!validLines.length) {
    return toast('Kam se kam 1 saman ka naam, matra aur rate bharein');
  }

  saveUndoSnapshotV32((V34.editTxId ? 'Edit Bill ' : 'New Bill ') + b.billNo);

  // If editing an existing bill, reverse previous stock & remove old linked purchase/movement/batch rows first
  if (V34.editTxId) {
    const oldPurchases = db.purchases.filter(p => !p.deleted && (String(p.txId) === String(V34.editTxId) || (V34.editBillId && String(p.billId) === String(V34.editBillId))));
    const oldPIds = new Set(oldPurchases.map(op => String(op.id)));
    oldPurchases.forEach(op => {
      const invItem = db.items.find(i => !i.deleted && (String(i.id) === String(op.itemId) || i.name.toLowerCase() === String(op.name || '').toLowerCase()));
      if (invItem && invItem.track !== false) {
        invItem.stock = Math.max(0, +((num(invItem.stock) || 0) - num(op.qty)).toFixed(3));
      }
    });
    db.purchases = db.purchases.filter(p => !oldPIds.has(String(p.id)));
    db.stockMovements = (db.stockMovements || []).filter(m => String(m.txId) !== String(V34.editTxId) && !oldPIds.has(String(m.refId)));
    db.batches = (db.batches || []).filter(bat => !oldPIds.has(String(bat.purchaseId)));
  }

  const isEditing = !!V34.editTxId;
  const txId = V34.editTxId || uid();
  const billId = V34.editBillId || uid();
  const grandTotal = +validLines.reduce((s, l) => s + l.total, 0).toFixed(2);
  const txItems = [];

  validLines.forEach(l => {
    let it = db.items.find(i => !i.deleted && i.name.toLowerCase() === l.name.toLowerCase());
    if (!it) {
      it = {
        id: uid(),
        name: l.name,
        department: l.department,
        subcategory: (categories[l.department] || [])[0] || 'General',
        unit: l.unit,
        rate: l.rate,
        stock: 0,
        min: 1,
        frequency: l.department === 'Puja' ? 'Yearly / Festival' : 'Monthly / Regular',
        track: true,
        archived: false,
        photo: ''
      };
      db.items.push(it);
    } else {
      it.rate = l.rate;
      if (it.track === undefined) it.track = true;
    }
    if (it.track) {
      it.stock = +((num(it.stock) || 0) + l.qty).toFixed(3);
    }

    const pid = uid();
    db.purchases.push({
      id: pid,
      billId,
      txId,
      itemId: it.id,
      name: it.name,
      department: l.department,
      subcategory: it.subcategory || 'General',
      qty: l.qty,
      unit: l.unit,
      rate: l.rate,
      total: l.total,
      date: b.date || today(),
      shop: b.shop || '',
      member: b.member || curMember(),
      paymentMethod: b.paymentMethod || 'UPI',
      manual: true
    });

    db.stockMovements.push({
      id: 'sm-p-' + pid,
      date: b.date || today(),
      itemId: it.id,
      itemName: it.name,
      department: l.department,
      type: 'purchase',
      qtyIn: l.qty,
      qtyOut: 0,
      unit: l.unit,
      rate: l.rate,
      totalCost: l.total,
      shop: b.shop || '',
      refType: 'purchase',
      refId: pid,
      txId,
      note: `${b.billNo}${b.shop ? ' · ' + b.shop : ''}`
    });

    txItems.push({
      purchaseId: pid,
      itemId: it.id,
      name: it.name,
      department: l.department,
      qty: l.qty,
      unit: l.unit,
      rate: l.rate,
      total: l.total
    });
  });

  const depts = [...new Set(validLines.map(x => x.department))];
  const mainCat = depts.length === 1 ? depts[0] : 'Groceries';
  const summaryNote = `${b.billNo}${b.shop ? ' · ' + b.shop : ''}: ${validLines.map(x => `${x.name} (${x.qty}${x.unit})`).join(', ')}`.slice(0, 160);

  const txPayload = {
    id: txId,
    billId,
    billNo: b.billNo,
    type: 'expense',
    amount: grandTotal,
    category: mainCat,
    note: summaryNote,
    merchant: b.shop || '',
    paymentMethod: b.paymentMethod || 'UPI',
    date: b.date || today(),
    accountId: b.accountId || db.accounts?.[0]?.id,
    member: b.member || curMember(),
    items: txItems
  };

  const existingTxIdx = db.transactions.findIndex(t => String(t.id) === String(txId));
  if (existingTxIdx >= 0) {
    db.transactions[existingTxIdx] = { ...db.transactions[existingTxIdx], ...txPayload };
  } else {
    db.transactions.push(txPayload);
  }

  db.purchaseBills = (db.purchaseBills || []).filter(pb => String(pb.id) !== String(billId) && String(pb.txId) !== String(txId));
  db.purchaseBills.push({
    id: billId,
    billNo: b.billNo,
    txId,
    date: b.date || today(),
    shop: b.shop || '',
    accountId: b.accountId || db.accounts?.[0]?.id,
    paymentMethod: b.paymentMethod || 'UPI',
    member: b.member || curMember(),
    notes: b.notes || '',
    total: grandTotal,
    items: txItems
  });

  V31.expandedTx.add(txId);
  V34.editTxId = null;
  V34.editBillId = null;
  V34.draft = createBlankDraftV34();

  ensureV33Store();
  if (!isEditing) checkBackupReminderV33(1);
  save();
  render();
  toast(isEditing ? `Bill ${b.billNo} updated (${validLines.length} items, ${money(grandTotal)})` : `Bill ${b.billNo} saved (${validLines.length} items, ${money(grandTotal)})`);
}

      if (m) m.remove();

    if (parchiCard) {
      const h3 = parchiCard.querySelector('h3');
      if (h3) h3.textContent = 'Shop-Wise Order Split';

document.addEventListener('click', e => {

  const [act, arg] = btn.dataset.v34act.split(/:(.*)/);

  if (act === 'toggle-inline') {
    V34.inlineOpen = !V34.inlineOpen;
    renderInlineTableIntoPageV34();
    return;
  }

    V34.editTxId = null;
    V34.editBillId = null;
    V34.draft = createBlankDraftV34();
    renderInlineTableIntoPageV34();
    return;
  }
  if (act === 'add-row') {
    if (!V34.draft) V34.draft = createBlankDraftV34();
    const lastDept = V34.draft.lines[V34.draft.lines.length - 1]?.department || 'Groceries';
    V34.draft.lines.push({ name: '', department: lastDept, qty: 1, unit: 'kg', rate: '' });
    renderInlineTableIntoPageV34();
    return;
  }
  if (act === 'rm-row') {
    if (V34.draft && V34.draft.lines.length > 1) {
      V34.draft.lines.splice(Number(arg), 1);
      renderInlineTableIntoPageV34();
    }
    return;
  }
  if (act === 'save-inline') {

  }
  if (act === 'edit-bill') {
    loadBillForEditV34(arg);
    return;
  }
});

});

var c=$('#content');if(!c)return;
var h=document.createElement('div');h.id='hud';
h.innerHTML='<div class="hud-row"><div class="hud-mark">EMPIRE</div><div class="hud-bar"></div><button id="hudTog" type="button">[ HUD ON ]</button></div><pre id="hudLog"></pre>';
c.parentNode.insertBefore(h,c);
var mini=document.createElement('button');mini.id='hudMini';mini.type='button';mini.textContent='[ HUD ]';document.body.appendChild(mini);
var xy=document.createElement('div');xy.id='hudXY';xy.textContent='X: 0  Y: 0';
var cx=document.createElement('div');cx.id='hudCX';var cy=document.createElement('div');cy.id='hudCY';
document.body.append(xy,cx,cy);
$('#hudTog').onclick=function(){mode(false)};mini.onclick=function(){mode(true)};
addEventListener('pointermove',function(e){xy.textContent='X: '+Math.round(e.clientX)+'  Y: '+Math.round(e.clientY);cx.style.top=e.clientY+'px';cy.style.left=e.clientX+'px'},{passive:true});
function data(){try{return JSON.parse(g(K))||{}}catch(e){return{}}}
function draw(){
var d=data(),n=new Date(),m=n.getFullYear()+'-'+pad(n.getMonth()+1),td=m+'-'+pad(n.getDate());
var t=(d.transactions||[]).filter(function(x){return!x.deleted}),inc=0,out=0;
t.forEach(function(x){if(String(x.date||'').indexOf(m)===0){if(x.type==='income')inc+=+x.amount||0;if(x.type==='expense')out+=+x.amount||0}});
var bills=(d.bills||[]).filter(function(b){return b.due&&String(b.status||'').toLowerCase()!=='paid'}).sort(function(a,b){return a.due<b.due?-1:1});
var over=bills.filter(function(b){return b.due<td}).length,nx=bills.filter(function(b){return b.due>=td})[0];
var low=(d.items||[]).filter(function(i){return i.track&&Number(i.stock||0)<=Number(i.min||0)}).length;
var L=['//','RECORDS \u2014 '+t.length+' \u2014 MONTH '+m];
if(!t.length&&!bills.length)L.push('  NO RECORDS YET \u2014 ADD FIRST TRANSACTION');
else{L.push('  INFLOW '+fm(inc)+' \u2014 OUTFLOW '+fm(out));L.push('  NET '+fm(inc-out));
if(nx)L.push('  NEXT BILL: '+nx.name+' \u2014 '+fm(+nx.amount||0)+' \u2014 '+Math.round((new Date(nx.due)-new Date(td))/864e5)+'D')}
L.push('};','STATUS: '+((over||low||inc-out<0)?'ATTENTION':'NOMINAL')+' \u2014 OVERDUE: '+over+' \u2014 LOW STOCK: '+low);
$('#hudLog').textContent=L.join('\n');tick()}
function tick(){var n=new Date(),l=$('#hudLog');if(!l)return;var s=city+' \u2014 '+pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());var a=l.textContent.split('\n');a[0]='// '+s;l.textContent=a.join('\n')}
draw();setInterval(tick,1000);
var tm;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(draw,120)}).observe(c,{childList:true});
addEventListener('storage',draw);
try{if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&!sessionStorage.getItem('hudBoot')){sessionStorage.setItem('hudBoot','1');
var b=document.createElement('div');b.id='hudBoot';b.innerHTML='<b>EMPIRE</b><span>Loading ( <i>0</i>% )</span>';document.body.appendChild(b);
var p=0,i=b.querySelector('i'),done=function(){clearInterval(iv);b.style.opacity=0;setTimeout(function(){b.remove()},420)};
var iv=setInterval(function(){p+=5;i.textContent=Math.min(p,100);if(p>=100)done()},45);b.onclick=done}}catch(e){}
})();
</script><!--/EMPIRE-HUD:body-->
</body></html>
